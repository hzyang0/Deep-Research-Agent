<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Deep Research Agent</title>
<!--
  React 聊天界面 (CDN 零构建)
  ===========================
  - 通过 CDN 引入 React + Babel + Tailwind,浏览器内编译,无需 node 构建链。
    面试谈资:"用 React 做组件化开发,同时通过 CDN 保持零构建的便捷,
    降低别人跑起项目的门槛。"
  - 通过 WebSocket 与后端双向通信:支持多轮对话、追问、深入指令。
  - Agent 工作时,实时把规划/检索/发现/反思过程渲染在助手气泡内的"工作面板"。
-->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { --bg:#0d1117; --accent:#f0a868; --accent2:#5fb3c4; }
  body { background:#0d1117; margin:0; font-family:-apple-system,"Segoe UI","PingFang SC",sans-serif; }
  ::-webkit-scrollbar { width:8px; } ::-webkit-scrollbar-thumb { background:#2a3038; border-radius:4px; }
  .serif { font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif; }
  .mono { font-family:"SF Mono","JetBrains Mono",Consolas,monospace; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  .pulse { animation:pulse 1.5s ease-in-out infinite; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
  .fade-in { animation:fadeIn .3s ease; }
</style>
<script>
  tailwind.config = { theme: { extend: { colors: {
    bg:'#0d1117', elev:'#161b22', elev2:'#1c2230', edge:'#2a3038',
    dim:'#8b949e', faint:'#6e7681', accent:'#f0a868', accent2:'#5fb3c4',
    grn:'#5cba7d', red:'#e5736b'
  }}}};
</script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const INTENT_LABEL = {
  NEW_RESEARCH: { text: "新研究", color: "bg-accent/15 text-accent" },
  DEEPEN:       { text: "深入", color: "bg-accent2/15 text-accent2" },
  FOLLOW_UP:    { text: "追问", color: "bg-grn/15 text-grn" },
  REFINE:       { text: "补充角度", color: "bg-accent2/15 text-accent2" },
};

const PHASES = [
  { key:"planning",    label:"规划" },
  { key:"researching", label:"检索" },
  { key:"reflecting",  label:"反思" },
  { key:"writing",     label:"成文" },
  { key:"answering",   label:"作答" },
];

function escapeHtml(s){ const d=document.createElement("div"); d.textContent=s||""; return d.innerHTML; }

function renderRich(text){
  let h = escapeHtml(text);
  h = h.replace(/^### (.+)$/gm,'<h3 class="text-base font-semibold text-white mt-4 mb-1">$1</h3>')
       .replace(/^## (.+)$/gm,'<h2 class="text-lg font-semibold text-white mt-5 mb-2 pb-1 border-b border-edge">$1</h2>')
       .replace(/^# (.+)$/gm,'<h1 class="text-xl font-bold text-white mt-5 mb-2">$1</h1>');
  h = h.replace(/\[(\d+)\]/g,'<sup class="mono text-accent text-[11px] cursor-default">[$1]</sup>');
  h = h.split(/\n\n+/).map(p=>{
    if(p.startsWith("<h")) return p;
    if(p.includes("参考来源")) return "";
    return '<p class="my-2 leading-relaxed">'+p.replace(/\n/g,"<br>")+'</p>';
  }).join("");
  return h;
}

function WorkPanel({ work }){
  const [open, setOpen] = useState(true);
  if(!work || (!work.subqs.length && !work.phase)) return null;
  return (
    <div className="mt-2 border border-edge rounded-xl overflow-hidden bg-bg/60">
      <button onClick={()=>setOpen(!open)}
        className="w-full flex items-center justify-between px-3 py-2 text-[11px] mono tracking-wide text-dim hover:text-white">
        <span>◆ Agent 工作过程</span>
        <div className="flex gap-1.5 items-center">
          {PHASES.filter(p=>work.seenPhases.has(p.key)).map(p=>(
            <span key={p.key} className={"px-1.5 py-0.5 rounded "+(work.phase===p.key?"bg-accent/20 text-accent pulse":"text-faint")}>{p.label}</span>
          ))}
          <span>{open?"▾":"▸"}</span>
        </div>
      </button>
      {open && (
        <div className="px-3 pb-3 space-y-2">
          {work.subqs.map((sq,i)=>(
            <div key={i} className={"border rounded-lg overflow-hidden "+(sq.done?"border-accent2/40":sq.active?"border-accent":"border-edge")}>
              <div className="px-3 py-2 text-[13px] bg-elev2 flex gap-2 items-start">
                <span className={"w-2 h-2 rounded-full mt-1.5 flex-shrink-0 "+(sq.done?"bg-accent2":sq.active?"bg-accent":"bg-faint")} />
                <span className="text-gray-200">{sq.text}</span>
              </div>
              {sq.queries.map((q,j)=>(
                <div key={j} className="px-3 py-1.5 text-[11px] mono text-accent border-t border-edge">🔎 {q}</div>
              ))}
              {sq.findings.map((f,j)=>(
                <div key={j} className="px-3 py-1.5 text-[12px] text-dim border-t border-edge">
                  › {f.content} <a href={f.url} target="_blank" className="text-accent2 mono text-[10px]">↗来源</a>
                </div>
              ))}
              {sq.done && <div className="px-3 py-1 text-[10px] mono text-faint border-t border-edge">✓ {sq.reason==="enough"?"信息充分":"达搜索上限"} · {sq.findings.length} 条</div>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function MessageBubble({ msg }){
  if(msg.role==="user"){
    return (
      <div className="flex justify-end fade-in">
        <div className="max-w-[80%] bg-accent text-[#1a1208] rounded-2xl rounded-br-sm px-4 py-2.5 text-[15px]">
          {msg.content}
        </div>
      </div>
    );
  }
  return (
    <div className="flex justify-start fade-in">
      <div className="max-w-[88%] w-full">
        {msg.intent && (
          <span className={"inline-block mb-1.5 px-2 py-0.5 rounded text-[10px] mono "+(INTENT_LABEL[msg.intent]?.color||"bg-elev2 text-dim")}>
            {INTENT_LABEL[msg.intent]?.text||msg.intent}
          </span>
        )}
        <WorkPanel work={msg.work} />
        {msg.content && (
          <div className={"mt-2 rounded-2xl rounded-bl-sm px-4 py-3 bg-elev border border-edge "+(msg.isReport?"serif text-[15px] text-gray-300":"text-[15px] text-gray-200")}
               dangerouslySetInnerHTML={{__html: renderRich(msg.content)}} />
        )}
        {msg.sources && msg.sources.length>0 && (
          <details className="mt-1.5 text-[12px]">
            <summary className="cursor-pointer text-dim mono">参考来源 ({msg.sources.length})</summary>
            <div className="mt-1 space-y-1">
              {msg.sources.map((s,i)=>(
                <div key={i} className="flex gap-2"><span className="mono text-accent">[{i+1}]</span>
                  <a href={s.url} target="_blank" className="text-accent2 hover:underline break-all">{s.title}</a></div>
              ))}
            </div>
          </details>
        )}
      </div>
    </div>
  );
}

function App(){
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [busy, setBusy] = useState(false);
  const [connected, setConnected] = useState(false);
  const [warn, setWarn] = useState("");
  const wsRef = useRef(null);
  const sessionRef = useRef(null);
  const scrollRef = useRef(null);
  const draftRef = useRef(null);

  useEffect(()=>{ scrollRef.current?.scrollIntoView({behavior:"smooth"}); }, [messages]);

  useEffect(()=>{
    fetch("/api/health").then(r=>r.json()).then(h=>{
      if(!h.llm_configured) setWarn("⚠️ 后端未检测到 API key，请在 .env 配置 OPENAI_API_KEY 后重启。");
    }).catch(()=>{});
    connect();
    return ()=> wsRef.current?.close();
  }, []);

  function connect(){
    const proto = location.protocol==="https:"?"wss":"ws";
    const ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.onopen = ()=> setConnected(true);
    ws.onclose = ()=> setConnected(false);
    ws.onmessage = (e)=> handleEvent(JSON.parse(e.data));
    wsRef.current = ws;
  }

  function updateDraft(fn){
    setMessages(prev=>{
      const next=[...prev];
      const idx = next.findIndex(m=>m._id===draftRef.current);
      if(idx>=0){ next[idx]={...next[idx]}; fn(next[idx]); }
      return next;
    });
  }
  function ensureWork(m){ if(!m.work) m.work={phase:null,seenPhases:new Set(),subqs:[]}; return m.work; }
  function findSubq(work, text){ return work.subqs.find(s=>s.text===text); }

  function handleEvent(ev){
    switch(ev.type){
      case "session": sessionRef.current=ev.session_id; break;
      case "intent": updateDraft(m=>{ m.intent=ev.intent; }); break;
      case "phase": updateDraft(m=>{ const w=ensureWork(m); w.phase=ev.name; w.seenPhases.add(ev.name); }); break;
      case "plan": updateDraft(m=>{ const w=ensureWork(m); ev.sub_questions.forEach(t=>{ if(!findSubq(w,t)) w.subqs.push({text:t,active:false,done:false,queries:[],findings:[],reason:null}); }); }); break;
      case "subq_start": updateDraft(m=>{ const s=findSubq(ensureWork(m),ev.sub_question); if(s)s.active=true; }); break;
      case "search": updateDraft(m=>{ const s=findSubq(ensureWork(m),ev.sub_question); if(s)s.queries.push(ev.query); }); break;
      case "finding": updateDraft(m=>{ const s=findSubq(ensureWork(m),ev.sub_question); if(s)s.findings.push({content:ev.content,url:ev.url,title:ev.title}); }); break;
      case "subq_done": updateDraft(m=>{ const s=findSubq(ensureWork(m),ev.sub_question); if(s){s.active=false;s.done=true;s.reason=ev.reason;} }); break;
      case "log": break;
      case "turn_done":
        updateDraft(m=>{ m.content=ev.answer; m.isReport=ev.is_report; m.sources=ev.sources; if(m.work)m.work.phase=null; });
        setBusy(false); draftRef.current=null; break;
      case "error":
        updateDraft(m=>{ m.content="⚠️ "+ev.message; });
        setBusy(false); draftRef.current=null; break;
    }
  }

  const send = useCallback(()=>{
    const text=input.trim();
    if(!text||busy||!connected) return;
    const userMsg={_id:Date.now()+"u", role:"user", content:text};
    const draftId=Date.now()+"a";
    draftRef.current=draftId;
    const draft={_id:draftId, role:"assistant", content:"", work:null, intent:null, sources:null};
    setMessages(prev=>[...prev, userMsg, draft]);
    setInput(""); setBusy(true);
    wsRef.current.send(JSON.stringify({ message:text, session_id:sessionRef.current }));
  }, [input, busy, connected]);

  const empty = messages.length===0;

  return (
    <div className="max-w-3xl mx-auto min-h-screen flex flex-col px-4">
      <header className="py-4 flex items-center justify-between border-b border-edge sticky top-0 bg-bg/90 backdrop-blur z-10">
        <div>
          <div className="mono text-[11px] tracking-[2px] text-accent uppercase">◆ Deep Research Agent</div>
          <div className="serif text-xl text-white">深度研究助手</div>
        </div>
        <span className={"mono text-[11px] px-2 py-1 rounded "+(connected?"text-grn bg-grn/10":"text-red bg-red/10")}>
          {connected?"● 已连接":"○ 连接中"}
        </span>
      </header>

      {warn && <div className="mt-3 text-[13px] text-red bg-red/10 border border-red/30 rounded-lg px-3 py-2">{warn}</div>}

      <div className="flex-1 py-5 space-y-4 overflow-y-auto">
        {empty && (
          <div className="text-center mt-20 text-dim">
            <div className="serif text-2xl text-white mb-2">开始一段研究对话</div>
            <p className="text-[14px] mb-6">输入一个研究问题，出报告后可以继续追问、要求深入某点、或补充新角度。</p>
            <div className="flex flex-wrap gap-2 justify-center max-w-lg mx-auto">
              {["对比 2024-2025 主流开源向量数据库的优劣","RAG 常见失败模式及缓解","LLM 推理加速技术对比"].map(s=>(
                <button key={s} onClick={()=>setInput(s)}
                  className="text-[13px] px-3 py-1.5 rounded-full border border-edge text-dim hover:border-accent hover:text-accent transition">{s}</button>
              ))}
            </div>
          </div>
        )}
        {messages.map(m=> <MessageBubble key={m._id} msg={m} />)}
        <div ref={scrollRef} />
      </div>

      <div className="sticky bottom-0 bg-bg/90 backdrop-blur pb-4 pt-2">
        <div className="border border-edge rounded-2xl bg-elev p-2 flex items-end gap-2">
          <textarea value={input} onChange={e=>setInput(e.target.value)}
            onKeyDown={e=>{ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();} }}
            rows={1} placeholder={busy?"Agent 正在研究中…":"输入研究问题，或针对上面的报告追问/要求深入…"}
            disabled={busy}
            className="flex-1 bg-transparent text-white text-[15px] px-2 py-2 outline-none resize-none placeholder:text-faint disabled:opacity-50" />
          <button onClick={send} disabled={busy||!connected||!input.trim()}
            className="bg-accent text-[#1a1208] font-semibold rounded-xl px-4 py-2 text-[14px] disabled:opacity-40 hover:brightness-110 transition">
            {busy?"研究中":"发送"}
          </button>
        </div>
        <div className="text-center text-[11px] text-faint mt-1.5 mono">Enter 发送 · Shift+Enter 换行 · 支持多轮追问与深入</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
